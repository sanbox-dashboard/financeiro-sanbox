  td.num{text-align:right;}

  tr.sec-rec td{color:var(--rec); background:var(--rec-bg);}
  tr.sec-fix td{color:var(--fix); background:var(--fix-bg);}
  tr.sec-fin td{color:var(--fin); background:var(--fin-bg);}
  tr.sec-rec td.catcol{background:var(--rec-bg); border-left:4px solid var(--rec);}
  tr.sec-fix td.catcol{background:var(--fix-bg); border-left:4px solid var(--fix);}
  tr.sec-fin td.catcol{background:var(--fin-bg); border-left:4px solid var(--fin);}
  tr.total td{font-weight:800; border-top:1.5px solid var(--ink); background:#FBFCFA;}
  tr.total td.catcol{background:#FBFCFA;}
  tr.pct td{color:var(--mut); font-size:12px; border-bottom:1px solid var(--line2);}
  tr.result td{font-weight:800; background:#111C17; color:#fff; border-bottom:none;}
  tr.result td.catcol{background:#111C17; color:#fff;}
  tr.result td.neg{color:#FF9B93;}
  .cat-expand{cursor:pointer;}
  .cat-expand .arrow{display:inline-block; width:14px; color:var(--mut); transition:transform .15s;}
  .cat-expand.open .arrow{transform:rotate(90deg);}
  .badge{display:inline-block; font-size:10px; font-weight:800; color:#fff; background:var(--new); border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:middle;}
  tr.subrow td{background:#FAFBF9; color:#3D4A44; font-size:12.5px;}

  .editable-tag{font-size:10.5px; color:var(--fin); font-weight:700; margin-left:6px;}

async function batchCols(id, aba, letters){
  const ranges = letters.map(c=>`ranges=${encodeURIComponent(aba+'!'+c+':'+c)}`).join('&');
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?${ranges}&key=${KEY}`);

  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n; };

function normComp(s){
  s = String(s||'').trim();
  let m = s.match(/^(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[1].padStart(2,'0')}/${m[2]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){ let mo=+m[1]; if(mo>12) mo=+m[2]; return `${String(mo).padStart(2,'0')}/${m[3]}`; }

}
function canal(nome,num){
  const n=(nome||'').toLowerCase();
  if(n.includes('mercado livre'))return 'Mercado Livre';
  if(n.includes('shopee'))return 'Shopee';
  if(n.includes('amazon'))return 'Amazon';
  if(n.includes('casas bahia')||n.includes('via varejo'))return 'Casas Bahia';

  if(u.startsWith('260'))return 'Shopee';
  if(/^\d{3}-\d+/.test(u))return 'Amazon';
  if(u.startsWith('51'))return 'Magazine Luiza';

      const mk=String(+parts[0]).padStart(2,'0')+'/'+parts[2];
      const t=parseFloat(ptot[i])||0;
      vend[mk]=(vend[mk]||0)+t;
      vendCanal[cn]=vendCanal[cn]||{}; vendCanal[cn][mk]=(vendCanal[cn][mk]||0)+t;
    }

    // custos dos produtos (itens × custo médio), com canal via pedido
    const [iPed,iSku,iQtd,iSit,iDat]=itensCols; const [pSku,pCusto]=prodCols;
    const pedCanalMap={};
    for(let i=1;i<pid.length;i++){ const idp=(pid[i]||'').trim(); if(idp) pedCanalMap[idp]=canal(penome[i],penum[i]); }
    const custoSku={};
    for(let i=1;i<pSku.length;i++){ const s=(pSku[i]||'').trim().toUpperCase(); if(s) custoSku[s]=parseFloat(pCusto[i])||0; }
    const VALID_ITEM=new Set(['faturado','aprovado','preparando envio','enviado','entregue','pronto para envio']);
    const custosProd={}; const custosProdCanal={};
    for(let i=1;i<iSku.length;i++){
      const sit=(iSit[i]||'').toLowerCase().trim();
      if(!VALID_ITEM.has(sit)) continue;
      const parts=(iDat[i]||'').trim().split('/');
      if(parts.length<3||parts[2]<'2026') continue;
      const mk=String(+parts[0]).padStart(2,'0')+'/'+parts[2];
      const q=parseFloat(iQtd[i])||1;
      const c=custoSku[(iSku[i]||'').trim().toUpperCase()];
      if(c===undefined) continue;
      custosProd[mk]=(custosProd[mk]||0)+q*c;
      const cn=pedCanalMap[(iPed[i]||'').trim()]||'Outros';
      custosProdCanal[cn]=custosProdCanal[cn]||{};
      custosProdCanal[cn][mk]=custosProdCanal[cn][mk]||{r:0,p:0};
      custosProdCanal[cn][mk].r+=q*c;
    }
    for(const k of Object.keys(custosProd)) custosProd[k]=Math.round(custosProd[k]*100)/100;
    for(const cn of Object.keys(custosProdCanal)) for(const k of Object.keys(custosProdCanal[cn])) custosProdCanal[cn][k].r=Math.round(custosProdCanal[cn][k].r*100)/100;

    // metas
    const MESN={janeiro:1,fevereiro:2,'março':3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
    const metaMes={}; const metaCanal={}; let canaisHdr=[];
    for(const row of (metasResp.values||[])){
      const c0=(row[0]||'').trim();
      if(c0==='Data'&&row.length>2){ canaisHdr=row.slice(1).map(x=>(x||'').trim()).filter(x=>x&&!x.toLowerCase().includes('total')); continue; }
      if(canaisHdr.length){
        const md=c0.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if(md){ const mk=md[2]+'/'+md[3];
          canaisHdr.forEach((cn,j)=>{ if(row[1+j]!==undefined){ metaCanal[cn]=metaCanal[cn]||{}; metaCanal[cn][mk]=(metaCanal[cn][mk]||0)+pnumBR(row[1+j]); } });
        }
      }
      let m=c0.match(/^([a-zA-ZÀ-ú]+)\/(\d{4})$/);
      if(m&&row[1]){ const mo=MESN[m[1].toLowerCase()]; if(mo) metaMes[String(mo).padStart(2,'0')+'/'+m[2]]=metaMes[String(mo).padStart(2,'0')+'/'+m[2]]||pnumBR(row[1]); continue; }
      m=c0.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if(m){ const k=m[2]+'/'+m[3]; const tot=row.length>6?pnumBR(row[6]):0;
        metaMes['__d'+k]=(metaMes['__d'+k]||0)+(tot||row.slice(1,6).reduce((s,x)=>s+pnumBR(x),0)); }
    }
    const metaFinal={};
    for(const k of Object.keys(metaMes)) if(k.startsWith('__d')) metaFinal[k.slice(3)]=metaMes[k];
    for(const k of Object.keys(metaMes)) if(!k.startsWith('__d')&&!metaFinal[k]) metaFinal[k]=metaMes[k];

    // meses
    const mset=new Set();
    for(let m=1;m<=12;m++) mset.add(String(m).padStart(2,'0')+'/2026');
    for(const cat of Object.keys(dados)) for(const c of Object.keys(dados[cat])) mset.add(c);
    const meses=[...mset].sort((a,b)=>{const[a1,a2]=a.split('/'),[b1,b2]=b.split('/');return(+a2-+b2)||(+a1-+b1);});

    // vendas por canal com meta por canal no previsto
    const vendasCanal={};
    const todosCanais=new Set([...Object.keys(vendCanal),...Object.keys(metaCanal)]);
    const metaKeysC=Object.keys(metaMes).filter(k=>!k.startsWith('__d'));
    for(const cn of todosCanais){
      vendasCanal[cn]={};
      for(const mk of meses){
        const [mm,yy]=mk.split('/');
        const nowD=new Date();
        const curK=String(nowD.getMonth()+1).padStart(2,'0')+'/'+nowD.getFullYear();
        const fut=(yy>curK.slice(3))||(yy===curK.slice(3)&&mk>=curK);
        let pv=0;
        if(fut&&yy==='2026'){
          pv=(metaCanal[cn]||{})[mk]||0;
          if(!pv){ const ks=Object.keys(metaCanal[cn]||{}).sort((a,b)=>(a.slice(3)+a.slice(0,2)).localeCompare(b.slice(3)+b.slice(0,2))); if(ks.length) pv=metaCanal[cn][ks[ks.length-1]]; }
        }
        const rv=Math.round(((vendCanal[cn]||{})[mk]||0)*100)/100;
        if(rv||pv) vendasCanal[cn][mk]={r:rv,p:Math.round(pv*100)/100};
      }
    }

    // vendas previsto = meta do mês atual em diante
    const now=new Date();
    const cur=String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
    const metaKeys=Object.keys(metaFinal).sort((a,b)=>{const[a1,a2]=a.split('/'),[b1,b2]=b.split('/');return(+a2-+b2)||(+a1-+b1);});
    const ultimaMeta=metaKeys.length?metaFinal[metaKeys[metaKeys.length-1]]:0;
    const vendas={};
    for(const mk of meses){
      const [mm,yy]=mk.split('/');
      const isFuturo = (yy>cur.slice(3)) || (yy===cur.slice(3)&&mk>=cur);
      vendas[mk]={ r: Math.round((vend[mk]||0)*100)/100,
                   p: isFuturo&&yy==='2026' ? (metaFinal[mk]??ultimaMeta) : (isFuturo?(metaFinal[mk]??0):0) };
    }

    // arredonda
    for(const cat of Object.keys(dados)) for(const c of Object.keys(dados[cat])){
      dados[cat][c].r=Math.round(dados[cat][c].r*100)/100; dados[cat][c].p=Math.round(dados[cat][c].p*100)/100;
    }

    for(const cat of Object.keys(detalhe)) for(const nome of Object.keys(detalhe[cat])) for(const c of Object.keys(detalhe[cat][nome])){
      const dd=detalhe[cat][nome][c];
      dd.r=Math.round(dd.r*100)/100; dd.p=Math.round(dd.p*100)/100;
    }

    // ── mesclagem por mês: a planilha de pedidos/itens é uma janela rolante e
    //    perde meses antigos. Meses passados que vierem >10% menores que o que
    //    já temos são preservados do histórico (embutido + atualizações anteriores).
    const preservados=[...(STATE.mesesPreservados||[])];
    const baseV=STATE.vendas||{}, baseVC=STATE.vendasCanal||{}, baseCP=STATE.custosProd||{}, baseCPC=STATE.custosProdCanal||{};
    for(const mk of meses){
      if(!/\/20\d\d$/.test(mk) || mk>=cur) continue;
      const fr=(vendas[mk]||{}).r||0, br=(baseV[mk]||{}).r||0;
      const fc=custosProd[mk]||0, bc=baseCP[mk]||0;
      if((br>0&&fr<br*0.9)||(bc>0&&fc<bc*0.9)){
        if(!preservados.includes(mk)) preservados.push(mk);
        if(baseV[mk]) vendas[mk]={r:baseV[mk].r, p:(vendas[mk]||{}).p||0};
        if(bc) custosProd[mk]=bc;
        for(const cn of Object.keys(baseVC)){ const e=(baseVC[cn]||{})[mk]; if(e){ vendasCanal[cn]=vendasCanal[cn]||{}; vendasCanal[cn][mk]={r:e.r, p:(vendasCanal[cn][mk]||{}).p||0}; } }
        for(const cn of Object.keys(baseCPC)){ const e=(baseCPC[cn]||{})[mk]; if(e){ custosProdCanal[cn]=custosProdCanal[cn]||{}; custosProdCanal[cn][mk]=e; } }
      }
    }
    const somaMesContas=(D,mk)=>{let s=0;for(const c of Object.keys(D||{})) s+=Math.abs(((D[c]||{})[mk]||{}).r||0)+Math.abs(((D[c]||{})[mk]||{}).p||0);return s;};
    for(const mk of meses){
      if(!/\/20\d\d$/.test(mk) || mk>=cur) continue;
      const f=somaMesContas(dados,mk), b=somaMesContas(STATE.dados,mk);
      if(b>0&&f<b*0.9){
        if(!preservados.includes(mk)) preservados.push(mk);
        for(const c of Object.keys(STATE.dados||{})){
          const e=(STATE.dados[c]||{})[mk]; if(!e) continue;
          dados[c]=dados[c]||{}; dados[c][mk]=e;
        }
        for(const c of Object.keys(STATE.detalhe||{})){
          for(const n of Object.keys(STATE.detalhe[c]||{})){
            const e=(STATE.detalhe[c][n]||{})[mk]; if(!e) continue;
            detalhe[c]=detalhe[c]||{}; detalhe[c][n]=detalhe[c][n]||{};
            detalhe[c][n][mk]=e;
          }
        }
      }
    }
    preservados.sort((a,b)=>(a.slice(3)+a.slice(0,2)).localeCompare(b.slice(3)+b.slice(0,2)));

    STATE={meses,dados,detalhe,vendas,vendasCanal,custosProd,custosProdCanal,
      mesesPreservados:preservados,
      metaInfo:'metas: '+(metaKeys.length?metaKeys[0]+' a '+metaKeys[metaKeys.length-1]:'nenhuma')+' · meses sem meta usam a última conhecida',
      semCompetencia:semComp,
      geradoEm:new Date().toLocaleString('pt-BR')};
    LIVE=true;
    stSet('dre_hist',{vendas,vendasCanal,custosProd,custosProdCanal,ts:Date.now()});
    render();
  }catch(e){
    LIVE=false;
    st.textContent='⚠️ Não consegui atualizar ao vivo ('+e.message+') — mostrando dados embutidos de '+STATE.geradoEm+'. Se abriu dentro do Claude, baixe o arquivo e abra no Chrome para os dados ao vivo.';
  }
}

function agendarProximas(){

  const alvos=[[12,0],[23,40]].map(([h,m])=>{const d=new Date(now);d.setHours(h,m,0,0);if(d<=now)d.setDate(d.getDate()+1);return d;});

async function stGet(k){
  try{ if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}

function applyReclass(){
  const clone = o => JSON.parse(JSON.stringify(o||{}));
  const D = clone(STATE.dados), T = clone(STATE.detalhe);
  for(const r of reclass){
    const v = T[r.cat] && T[r.cat][r.nome] && T[r.cat][r.nome][r.de];
    if(!v || (!v.r && !v.p)) continue;
    delete T[r.cat][r.nome][r.de];
    if(D[r.cat] && D[r.cat][r.de]){
      D[r.cat][r.de].r = Math.round((D[r.cat][r.de].r - v.r)*100)/100;
      D[r.cat][r.de].p = Math.round((D[r.cat][r.de].p - v.p)*100)/100;
    }
    T[r.paraCat]=T[r.paraCat]||{}; T[r.paraCat][r.nome]=T[r.paraCat][r.nome]||{};
    const dst=T[r.paraCat][r.nome][r.para]=T[r.paraCat][r.nome][r.para]||{r:0,p:0,n:0,vl:[]};
    dst.r=Math.round((dst.r+v.r)*100)/100; dst.p=Math.round((dst.p+v.p)*100)/100;
    dst.n=(dst.n||0)+(v.n||0);
    dst.vl=[...(dst.vl||[]),...(v.vl||[])];
    D[r.paraCat]=D[r.paraCat]||{};
    const da=D[r.paraCat][r.para]=D[r.paraCat][r.para]||{r:0,p:0};
    da.r=Math.round((da.r+v.r)*100)/100; da.p=Math.round((da.p+v.p)*100)/100;
  }
  return {dados:D, detalhe:T};
}

function dupInfo(mm, mk){
  const v=mm[mk];
  if(!v || !(v.vl) || v.vl.length<2) return null;
  const grupos={};
  for(const it of v.vl){
    const h=String(it[2]||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(!h) continue;
    (grupos[h]=grupos[h]||[]).push(it);
  }
  const dups=[];
  for(const h of Object.keys(grupos)){
    const itens=grupos[h];
    if(itens.length>=2){
      const vms=[...new Set(itens.map(i=>i[1]).filter(x=>x))];
      const tot=itens.reduce((s,i)=>s+(i[0]||0),0);
      dups.push({h:String(itens[0][2]).slice(0,60), n:itens.length, vms, tot, forte:vms.length>1});
    }
  }
  if(!dups.length) return null;
  return {lvl: dups.some(d=>d.forte)?2:1, dups};
}
function dupLevel(mm, mk){ const i=dupInfo(mm,mk); return i?i.lvl:0; }
function dupTitle(mm, mk){
  const i=dupInfo(mm,mk);
  if(!i) return '';
  const partes=i.dups.map(d=>`${d.n}× "${d.h}" (total ${fmt.format(d.tot)}${d.vms.length?`; venc. ${d.vms.join(', ')}`:''})`);
  return `Lançamentos com a mesma identificação nesta competência: ${partes.join(' · ')}` +
    (i.lvl===2 ? ' — vencimentos em meses diferentes: PROVÁVEL duplicidade de competência' : ' — mesmo vencimento: confira se é lançamento duplicado');
}

}

function dataRow(cat, pctBase){
  const isNew=novas.includes(cat);

  const dm=catDupMap(cat);
  let html=`<tr class="cat-expand${openCats.has(cat)?' open':''}" data-cat="${safe}">

  // células com marcador de duplicidade no mês
  const vals=dataVals(cat);
  for(const mk of months){
    const v=vals[mk]||{r:0,p:0};
    const dc=dm[mk]?' dupc':'';
    const tt=dm[mk]?` title="há lançamentos com possível duplicidade neste mês — abra a categoria"`:'';
    const br=pctBase?((pctBase[mk]||{}).r||0):0, bp=pctBase?((pctBase[mk]||{}).p||0):0;
    html+=`<td class="num${v.r<0?' neg':''}${dc}"${dm[mk]?tt:(v.r&&br?tip(v.r,br,''):'')}>${money(v.r)}</td>`;
    html+=`<td class="num prev${v.p<0?' neg':''}${dc}"${dm[mk]?tt:(v.p&&bp?tip(v.p,bp,' previstas'):'')}>${money(v.p)}</td>`;
  }
  const tr=months.reduce((s,mk)=>s+((vals[mk]||{}).r||0),0), tp=months.reduce((s,mk)=>s+((vals[mk]||{}).p||0),0);
  const btr=pctBase?months.reduce((s,mk)=>s+((pctBase[mk]||{}).r||0),0):0;
  const btp=pctBase?months.reduce((s,mk)=>s+((pctBase[mk]||{}).p||0),0):0;
  html+=`<td class="num${tr<0?' neg':''}"${tr&&btr?tip(tr,btr,''):''}><b>${money0(tr)}</b></td><td class="num prev${tp<0?' neg':''}"${tp&&btp?tip(tp,btp,' previstas'):''}><b>${money0(tp)}</b></td></tr>`;
  if(openCats.has(cat)) html+=subRows(cat);
  return html;
}
function subRows(cat){
  const cc = det[cat]||{};
  const list = Object.entries(cc).map(([nome,mm])=>{
    let tot=0; for(const mk of months){ const v=mm[mk]; if(v) tot+=Math.abs(v.r)+Math.abs(v.p); }
    return {nome, mm, tot};
  }).filter(x=>x.tot>0).sort((a,b)=>b.tot-a.tot);
  if(!list.length) return `<tr class="subrow"><td class="catcol">— sem lançamentos no período</td><td colspan="${2*months.length+2}"></td></tr>`;
  let html='';
  for(const {nome,mm} of list){
    const sn=nome.replace(/"/g,'&quot;'), sc=cat.replace(/"/g,'&quot;');
    html+=`<tr class="subrow"><td class="catcol" title="${sn}"><span class="reclx" data-rcat="${sc}" data-rnome="${sn}" title="Reclassificar categoria/competência deste custo">⇄</span>${nome}</td>`;
    let tr=0,tp=0;
    for(const mk of months){
      const v=mm[mk]||{r:0,p:0}; tr+=v.r; tp+=v.p;
      const lvl=dupLevel(mm,mk);
      const cls=lvl?` dup${lvl}`:'';
      const tt=lvl?` title="${dupTitle(mm,mk).replace(/"/g,'&quot;')}"`:'';
      html+=`<td class="num${v.r<0?' neg':''}${cls}"${tt}>${money(v.r)}</td><td class="num prev${v.p<0?' neg':''}${cls}"${tt}>${money(v.p)}</td>`;
    }
    html+=`<td class="num${tr<0?' neg':''}">${money(tr)}</td><td class="num prev${tp<0?' neg':''}">${money(tp)}</td></tr>`;
  }
  return html;
}
const sectionRow=(cls,label)=>`<tr class="section ${cls}"><td class="catcol">${label}</td><td colspan="${2*months.length+2}"></td></tr>`;
const totalRow=(label,vals,cls='total')=>`<tr class="${cls}"><td class="catcol">${label}</td>${cellsFor(vals,true)}</tr>`;
function resultPctRow(label,num,den){
  let html=`<tr class="result"><td class="catcol">${label}</td>`;
  let tn=0,td_=0,tnp=0,tdp=0;
  for(const mk of months){
    const d=(den[mk]||{}).r||0, n=(num[mk]||{}).r||0;
    const dp=(den[mk]||{}).p||0, np=(num[mk]||{}).p||0;
    tn+=n; td_+=d; tnp+=np; tdp+=dp;
    html+=`<td class="num${n<0?' neg':''}">${d?fmtPct.format(n/d):'—'}</td><td class="num prev${np<0?' neg':''}">${dp?fmtPct.format(np/dp):'—'}</td>`;
  }
  html+=`<td class="num${tn<0?' neg':''}"><b>${td_?fmtPct.format(tn/td_):'—'}</b></td><td class="num prev${tnp<0?' neg':''}"><b>${tdp?fmtPct.format(tnp/tdp):'—'}</b></td></tr>`;
  return html;
}
function pctRow(label,num,den,usePrevDen){
  let html=`<tr class="pct"><td class="catcol">${label}</td>`;
  for(const mk of months){
    const d=(den[mk]||{}).r||0, n=(num[mk]||{}).r||0;

  return html;
}

function exportXLSX(){
  if(typeof XLSX==='undefined'){ alert('Biblioteca de Excel não carregou (sem internet?). Tente novamente.'); return; }
  const recData=catsIn('receitas'), fixData=catsIn('fixo'), finData=catsIn('financeiro');
  const vendas=vendasVals();
  const deducoes=sumVals([...recData.map(dataVals), custosProdVals(), manualVals('Comissões'), manualVals('Custos Marketplaces')]);
  const totalReceitas=subVals(sumVals([vendas, manualVals('Frete Entrada')]),deducoes);
  const totalFixos=sumVals(fixData.map(dataVals));
  const totalFin=sumVals([...finData.map(dataVals), ...EDITAVEIS_FIN.map(manualVals)]);
  const resultado=subVals(subVals(totalReceitas,totalFixos),totalFin);

  const header=['Categoria'];
  for(const mk of months){ header.push(mk+' Realizado', mk+' Previsto'); }
  header.push('Total Realizado','Total Previsto');

  const aoa=[header];
  const pctRows=new Set();
  const push=(label,vals)=>{ const row=[label];
    let tr=0,tp=0;
    for(const mk of months){ const v=vals[mk]||{r:0,p:0}; row.push(v.r||0, v.p||0); tr+=v.r||0; tp+=v.p||0; }
    row.push(tr,tp); aoa.push(row); };
  const pushPct=(label,num,den)=>{ const row=[label];
    let tn=0,td=0,tnp=0,tdp=0;
    for(const mk of months){ const n=(num[mk]||{}).r||0,d=(den[mk]||{}).r||0,np=(num[mk]||{}).p||0,dp=(den[mk]||{}).p||0;
      row.push(d?n/d:'', dp?np/dp:''); tn+=n;td+=d;tnp+=np;tdp+=dp; }
    row.push(td?tn/td:'', tdp?tnp/tdp:'');
    pctRows.add(aoa.length); aoa.push(row); };
  const pushSec=label=>aoa.push([label]);

  pushSec('RECEITAS');
  push('Vendas',vendas);
  push('Frete Entrada',manualVals('Frete Entrada'));
  for(const c of recData) push(c,dataVals(c));
  push('Custos dos produtos',custosProdVals());
  push('Comissões',manualVals('Comissões'));
  push('Custos Marketplaces',manualVals('Custos Marketplaces'));
  push('TOTAL RECEITAS / VENDAS',totalReceitas);
  pushPct('Margem s/ Vendas',totalReceitas,vendas);
  pushSec('CUSTOS FIXOS');
  for(const c of fixData) push(c,dataVals(c));
  push('TOTAL CUSTOS FIXOS',totalFixos);
  pushPct('% s/ Vendas',totalFixos,vendas);
  pushSec('CUSTOS FINANCEIROS');
  for(const c of finData) push(c,dataVals(c));
  for(const n of EDITAVEIS_FIN) push(n,manualVals(n));
  push('TOTAL CUSTOS FINANCEIROS',totalFin);
  push('RESULTADO (Receitas − Fixos − Financeiros)',resultado);
  pushPct('RESULTADO % (Resultado ÷ Vendas)',resultado,vendas);

  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let R=1;R<=range.e.r;R++){
    for(let C=1;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      if(ws[addr]&&typeof ws[addr].v==='number') ws[addr].z = pctRows.has(R)?'0.0%':'#,##0.00';
    }
  }
  ws['!cols']=[{wch:38},...Array(2*months.length+2).fill({wch:14})];
  ws['!freeze']={xSplit:1,ySplit:1};

  // aba detalhe por contato
  const h2=['Categoria','Contato'];
  for(const mk of months){ h2.push(mk+' Realizado', mk+' Previsto'); }
  h2.push('Total Realizado','Total Previsto');
  const aoa2=[h2];
  for(const cat of Object.keys(det).sort((a,b)=>a.localeCompare(b,'pt-BR'))){
    if(groupOf(cat)==='ignorar') continue;
    for(const nome of Object.keys(det[cat]).sort((a,b)=>a.localeCompare(b,'pt-BR'))){
      const mm=det[cat][nome]; const row=[cat,nome]; let tr=0,tp=0,any=false;
      for(const mk of months){ const v=mm[mk]||{r:0,p:0}; row.push(v.r||0,v.p||0); tr+=v.r||0; tp+=v.p||0; if(v.r||v.p)any=true; }
      if(!any) continue;
      row.push(tr,tp); aoa2.push(row);
    }
  }
  const ws2=XLSX.utils.aoa_to_sheet(aoa2);
  const rg2=XLSX.utils.decode_range(ws2['!ref']);
  for(let R=1;R<=rg2.e.r;R++) for(let C=2;C<=rg2.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:R,c:C});
    if(ws2[addr]&&typeof ws2[addr].v==='number') ws2[addr].z='#,##0.00';
  }
  ws2['!cols']=[{wch:28},{wch:38},...Array(2*months.length+2).fill({wch:14})];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'DRE');
  XLSX.utils.book_append_sheet(wb,ws2,'Detalhe por contato');
  const nome='planejamento_financeiro_'+(year==='TODOS'?'completo':year)+'.xlsx';
  XLSX.writeFile(wb,nome);
}

(async()=>{
  catmap=(await stGet('dre_catmap'))||{};
  manual=(await stGet('dre_manual'))||{};
  reclass=(await stGet('dre_reclass'))||[];
  try{
    const h=await stGet('dre_hist');
    if(h&&h.vendas){
      for(const mk of Object.keys(h.vendas)){
        const hr=(h.vendas[mk]||{}).r||0, er=((STATE.vendas||{})[mk]||{}).r||0;
        if(hr>0&&er<hr*0.9){
          STATE.vendas[mk]={r:hr,p:((STATE.vendas||{})[mk]||{}).p||0};
          if(h.custosProd&&h.custosProd[mk]) STATE.custosProd[mk]=h.custosProd[mk];
          for(const cn of Object.keys(h.vendasCanal||{})){ const e=h.vendasCanal[cn][mk]; if(e){ STATE.vendasCanal[cn]=STATE.vendasCanal[cn]||{}; STATE.vendasCanal[cn][mk]=e; } }
          for(const cn of Object.keys(h.custosProdCanal||{})){ const e=h.custosProdCanal[cn][mk]; if(e){ STATE.custosProdCanal[cn]=STATE.custosProdCanal[cn]||{}; STATE.custosProdCanal[cn][mk]=e; } }
          STATE.mesesPreservados=[...new Set([...(STATE.mesesPreservados||[]),mk])];
        }
      }
    }
  }catch(e){}
  render();
  document.getElementById('btnLive').addEventListener('click',()=>liveUpdate('manual'));
  document.getElementById('btnXls').addEventListener('click',exportXLSX);
  liveUpdate('abertura');
  agendarProximas();
})();
